<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lrental Login</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="login-page" data-page="login">
    <div class="login-shell">
        <div class="login-card">
            <div class="login-brand">
                <div class="logo-badge">
                    <svg width="42" height="42" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="48" height="48" rx="8" fill="#002F34" />
                        <path d="M12 11V37H26" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M22 11H31C35.4 11 39 14.5 39 19C39 23.5 35.4 27 31 27H22" stroke="#00A49F"
                            stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M28 27L38 37" stroke="#00A49F" stroke-width="5" stroke-linecap="round" />
                    </svg>
                </div>
                <h1>Lrental</h1>
            </div>

            <h2>Login</h2>
            <form id="loginForm" class="login-form">
                <label for="username">Username</label>
                <input id="username" type="text" class="login-input" placeholder="Enter username" required />

                <label for="password">Password</label>
                <input id="password" type="password" class="login-input" placeholder="Enter password" required />

                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
